[project]
name = "readaloud"
version = "1.2.3"
description = "Terminal read-aloud: Kokoro TTS with word-level highlighting and less-style navigation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx-audio>=0.5.3",
    # misaki[en] would drag in spacy-curated-transformers -> torch (548 MB) purely for
    # transformer-based spaCy pipelines.  We use en_core_web_sm, which does not need it,
    # so the "en" extra is spelled out by hand instead.  Verified: POS disambiguation
    # ("he read" /ɹɛd/ vs "please read" /ɹid/) is unaffected.
    "misaki>=0.9.4",
    "espeakng-loader>=0.2.4",
    "num2words",
    "phonemizer-fork",
    "spacy",
    "sounddevice>=0.5.6",
    "numpy>=2.0",
    "en-core-web-sm",
    # `-md` finds the tables in the Markdown source with it.  mdcat, which draws
    # them, is deliberately not a dependency: only `-md` needs it, at runtime.
    "markdown-it-py>=3.0",
]

[project.optional-dependencies]
# Take over the system Play/Pause button (headphones, Control Center).
# Optional: without it readaloud falls back to the spacebar alone.
mediakeys = [
    "pyobjc-framework-Cocoa>=10.0",
    "pyobjc-framework-MediaPlayer>=10.0",
]
# The Python grammar, so a .py file is read through its syntax tree and
# coloured out of the box (docs/pronunciations.md, "Syntax").  Any other
# language is its own tree-sitter-<language> package, installed next to it.
grammars = [
    "tree-sitter-python>=0.25",
]

[project.scripts]
readaloud = "readaloud.cli:main"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[tool.maturin]
# Python in src/readaloud, the compiled half (readaloud._core) built from rust/.
python-source = "src"
module-name = "readaloud._core"
manifest-path = "rust/Cargo.toml"

[tool.maturin.sbom]
# The software bill of materials maturin would put in the wheel names the
# crate by its absolute source path, which the bundle must not ship.
rust = false

[tool.uv]
# uv rebuilds the editable install only when one of these changes.  The Rust
# sources are part of the build, so a Rust edit rebuilds on the next `uv run`
# rather than leaving the tests on a stale extension.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "rust/Cargo.toml" },
    { file = "rust/Cargo.lock" },
    { file = "rust/src/**/*.rs" },
]

[dependency-groups]
dev = ["pytest>=8.0", "tree-sitter-python>=0.25"]   # the grammar the syntax tests use

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs the Kokoro model weights and an audio device"]
