[project]
name = "readaloud"
version = "0.1.0"
description = "Terminal read-aloud: Kokoro TTS with word-level highlighting and less-style navigation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx-audio>=0.5.3",
    "misaki[en]>=0.9.4",
    "espeakng-loader>=0.2.4",
    "sounddevice>=0.5.6",
    "numpy>=2.0",
    "en-core-web-sm",
]

[project.scripts]
readaloud = "readaloud.cli:main"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/readaloud"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs the Kokoro model weights and an audio device"]
