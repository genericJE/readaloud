# ~/.readaloud/code.conf: what holds for every source file, whatever the
# language, between readaloud.conf and the language's own file.  A file is
# source code when its suffix has a grammar readaloud knows: .py, .rs, .js,
# .go, .c, ... but not .md or .html, which are text.

[config]
# read as written: no Markdown stripping, indented code cut into chunks
markdown = no

[pronunciations]
# the operators, which the voice would otherwise skip; said in every language
= = equals
== = is equal to
!= = not equals
< = less than
> = greater than
<= = less than or equal to
>= = greater than or equal to
- = minus
* = times
/ = divided by
// = floor divided by
** = to the power of
% = modulo
& = bitwise and
| = pipe
|= = pipe equals
~ = bitwise not
^ = xor
<< = shift left
>> = shift right
+= = plus equals
-= = minus equals
*= = times equals
/= = divided equals
-> = arrow
